[project]
name = "netsense-orch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.25,<5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14", "mypy>=1.18", "types-jsonschema", "datamodel-code-generator>=0.35,<0.36"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["netsense_runner", "netsense_orch"]
